name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Allow the workflow to grant itself the Pages/IdToken scopes it needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and let in-progress ones finish instead of
# being cancelled mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is gitignored in this repo, so neither `npm ci` nor
      # setup-node's `cache: npm` (which needs a lockfile to hash) can be used.
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # Deploys the artifact as-is; the flag only matters if the site is ever
      # switched to branch-based publishing.
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      # Requires Pages to be enabled once in Settings > Pages with source
      # "GitHub Actions". The `enablement` input cannot do it for us: it needs
      # a token other than GITHUB_TOKEN, which Actions does not provide.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
